# Konfig for zizmor-sikkerhetsrevisjonen (kjøres av lint-workflows.yml).
# Unntak skal alltid ha en begrunnelse her - se også .github/workflows/README.md.

rules:
  bot-conditions:
    ignore:
      # Audit-en antar at aktør-sjekken `github.actor == 'dependabot[bot]'` står alene (spoofbar via f.eks. `@dependabot rebase`).
      # Hos oss står den i kombinasjon med forfatter-sjekken `pull_request.user.login` - sammen binder de både hvem som skrev PR-en og hvem som utløste kjøringen.
      # Se sikkerhetsreviewens funn F1 i navikt/tiltakspenger#31 (workflows-README beskriver konvensjonen).
      - dependabot-auto-merge.yml
      # Node-varianten har samme kombinerte gate og samme begrunnelse.
      - dependabot-auto-merge-node.yml
  unpinned-uses:
    config:
      policies:
        # Delte workflows i dette repoet refereres bevisst med @main fra callerne: main her er en dokumentert tillitsgrense,
        # og callerne skal plukke opp forbedringer uten PR i hvert repo.
        # Mønsteret må ha /* for å matche reusable workflow-stier (owner/repo alene matcher ikke subpath).
        "navikt/tiltakspenger-workflows/*": ref-pin
        # Actions refereres med tag og låses til commit i .github/workflows/actions.lock (gh actions-lock), også transitive avhengigheter.
        # zizmor kjenner ikke lockfila; at hver referanse faktisk er låst sjekkes av lockfil-jobben i lint-workflows.yml.
        "*": ref-pin
