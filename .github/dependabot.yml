# Holder actions i de delte workflowene ferske; Dependabot oppdaterer tag-en og låsen i .github/workflows/actions.lock i samme PR.
# Samme oppsett som github-actions-blokka i de andre repoene (jf. felles Dependabot-konvensjon).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      # Navs egne pakker tas med én gang; cooldownen gjelder tredjepart.
      exclude:
        - "nais/*"
        - "navikt/*"
