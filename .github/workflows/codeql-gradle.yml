name: CodeQL gradle (delt)

# Delt workflow for alle tiltakspenger-repoene - se README.md i denne mappa for konvensjoner og plasseringsbegrunnelse.
# CodeQL-analyse for Kotlin/JVM-repo med manuelt gradle-bygg.
# Kalleren eier trigger (schedule/workflow_dispatch) og concurrency-gruppa - en delt workflow lager ingen egen run.
# Kalleren må gi jobben `contents: read` + `actions: read` + `security-events: write` (opplasting til code scanning).

on:
  workflow_call:
    inputs:
      java-version:
        description: Java-versjon for byggesteget
        required: false
        type: string
        default: '25'

# Minste privilegium: toppnivået nullstiller token-rettighetene for jobber som ikke deklarerer egne.
permissions: {}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-and-quality
          config: |
            query-filters:
              - exclude:
                  problem.severity:
                    - recommendation
      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: ${{ inputs.java-version }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      # Kun kompilering - CodeQL trenger klassene, ikke testkjøring; cache-flaggene sikrer at all kode faktisk kompileres i denne kjøringen.
      - name: Build
        run: ./gradlew clean classes --no-build-cache --no-configuration-cache
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:java-kotlin"
